apiVersion: v2
name: spacelift-mp
description: Spacelift Self-Hosted for Google Cloud Marketplace. Wraps the spacelift-self-hosted chart.
type: application
# The release version of the Marketplace listing. It follows the Spacelift
# Self-Hosted version; a change to the deployer alone adds -gcp.N. Renovate
# moves version, appVersion and the dependency below together.
version: 7.2.0
appVersion: "7.2.0"
home: https://spacelift.io
sources:
  - https://github.com/spacelift-io/self-hosted-gcp-marketplace
dependencies:
  - name: spacelift-self-hosted
    alias: spacelift
    version: 7.2.0
    repository: https://downloads.spacelift.io/helm
    # Off when no license is given: then only the placeholder is installed.
    condition: installSpacelift
