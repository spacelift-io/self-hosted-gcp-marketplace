{{- if .Values.installSpacelift }}
{{- $v := .Values }}
{{- $b := .Values.storage.buckets }}
{{- $domain := include "spacelift-mp.required" (list $v.spacelift.shared.serverHostname "spacelift.shared.serverHostname") }}
# Settings shared by the server and the drain.
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-shared
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spacelift-mp.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENVIRONMENT: "prod"
  SERVER_DOMAIN: {{ $domain | quote }}
  MQTT_BROKER_TYPE: "builtin"
  {{- /* Built from the spacelift-self-hosted chart's own context, so it matches its MQTT Service whatever its fullnameOverride is. */}}
  MQTT_BROKER_ENDPOINT: {{ printf "tls://%s-mqtt.%s.svc.cluster.local:%v" (include "spacelift.fullname" .Subcharts.spacelift) .Release.Namespace .Subcharts.spacelift.Values.mqttService.port | quote }}
  ENCRYPTION_TYPE: "rsa"
  ENCRYPTION_RSA_PRIVATE_KEY: {{ include "spacelift-mp.required" (list $v.encryption.rsaPrivateKey "encryption.rsaPrivateKey") | quote }}
  MESSAGE_QUEUE_TYPE: "postgres"
  OBJECT_STORAGE_TYPE: "gcp"
  OBJECT_STORAGE_BUCKET_DELIVERIES: {{ include "spacelift-mp.required" (list $b.deliveries "storage.buckets.deliveries") | quote }}
  OBJECT_STORAGE_BUCKET_LARGE_QUEUE_MESSAGES: {{ include "spacelift-mp.required" (list $b.largeQueueMessages "storage.buckets.largeQueueMessages") | quote }}
  OBJECT_STORAGE_BUCKET_METADATA: {{ include "spacelift-mp.required" (list $b.metadata "storage.buckets.metadata") | quote }}
  OBJECT_STORAGE_BUCKET_MODULES: {{ include "spacelift-mp.required" (list $b.modules "storage.buckets.modules") | quote }}
  OBJECT_STORAGE_BUCKET_POLICY_INPUTS: {{ include "spacelift-mp.required" (list $b.policyInputs "storage.buckets.policyInputs") | quote }}
  OBJECT_STORAGE_BUCKET_RUN_LOGS: {{ include "spacelift-mp.required" (list $b.runLogs "storage.buckets.runLogs") | quote }}
  OBJECT_STORAGE_BUCKET_RUN_OBSERVABILITY: {{ include "spacelift-mp.required" (list $b.runObservability "storage.buckets.runObservability") | quote }}
  OBJECT_STORAGE_BUCKET_STATES: {{ include "spacelift-mp.required" (list $b.states "storage.buckets.states") | quote }}
  OBJECT_STORAGE_BUCKET_UPLOADS: {{ include "spacelift-mp.required" (list $b.uploads "storage.buckets.uploads") | quote }}
  OBJECT_STORAGE_BUCKET_UPLOADS_URL: "https://storage.googleapis.com"
  OBJECT_STORAGE_BUCKET_USER_UPLOADED_WORKSPACES: {{ include "spacelift-mp.required" (list $b.userUploadedWorkspaces "storage.buckets.userUploadedWorkspaces") | quote }}
  OBJECT_STORAGE_BUCKET_WORKSPACE: {{ include "spacelift-mp.required" (list $b.workspace "storage.buckets.workspace") | quote }}
  OBJECT_STORAGE_BUCKET_USAGE_ANALYTICS: ""
  DATABASE_URL: {{ include "spacelift-mp.databaseURL" . | quote }}
  DATABASE_READ_ONLY_URL: {{ include "spacelift-mp.databaseURL" . | quote }}
  LICENSE_TYPE: "jwt"
  LICENSE_TOKEN: {{ include "spacelift-mp.required" (list $v.license.token "license.token") | quote }}
  OBSERVABILITY_VENDOR: "Disabled"
---
# Settings of the server.
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spacelift-mp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
  The admin login is the only way to sign in to a fresh install: SSO is set up
  from the UI after that. The form can't require the admin fields: an install
  without a license (the placeholder) doesn't need them, same as the encryption
  key and the registry password. So the chart requires them for a licensed
  install only.
  */}}
  ADMIN_USERNAME: {{ include "spacelift-mp.required" (list $v.admin.username "admin.username") | quote }}
  ADMIN_PASSWORD: {{ include "spacelift-mp.required" (list $v.admin.password "admin.password") | quote }}
  WEBHOOKS_ENDPOINT: {{ printf "https://%s/webhooks" $domain | quote }}
---
# Settings of the drain.
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-drain
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spacelift-mp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DRAIN_CONCURRENCY_ASYNC_JOBS: {{ $v.drain.concurrency.asyncJobs | quote }}
  DRAIN_CONCURRENCY_ASYNC_JOBS_FIFO: {{ $v.drain.concurrency.asyncJobsFifo | quote }}
  DRAIN_CONCURRENCY_CRONJOBS: {{ $v.drain.concurrency.cronjobs | quote }}
  DRAIN_CONCURRENCY_DLQ: {{ $v.drain.concurrency.dlq | quote }}
  DRAIN_CONCURRENCY_DLQ_FIFO: {{ $v.drain.concurrency.dlqFifo | quote }}
  DRAIN_CONCURRENCY_EVENTS: {{ $v.drain.concurrency.events | quote }}
  DRAIN_CONCURRENCY_IOT: {{ $v.drain.concurrency.iot | quote }}
  DRAIN_CONCURRENCY_WEBHOOKS: {{ $v.drain.concurrency.webhooks | quote }}
{{- end }}
