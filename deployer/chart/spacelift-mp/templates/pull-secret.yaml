{{- if .Values.installSpacelift }}
{{- $server := .Values.registry.server }}
{{- $username := include "spacelift-mp.required" (list .Values.registry.username "registry.username") }}
{{- $password := include "spacelift-mp.required" (list .Values.registry.password "registry.password") }}
# Pull secret for the Spacelift images on oci.spacelift.io.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spacelift-mp.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $server (dict "username" $username "password" $password "auth" (printf "%s:%s" $username $password | b64enc))) | toJson | b64enc }}
{{- end }}
